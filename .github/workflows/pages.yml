name: Publish site

# Publishes the static app to GitHub Pages whenever main changes. This deploys
# code and the committed data bundle only; it never fetches market data.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run model tests
        run: node --test tests/model.test.mjs
      - name: Assemble site
        run: |
          mkdir -p site/data
          cp index.html app.css app.js model.js site/
          cp data/universe.json data/history.json site/data/
          touch site/.nojekyll
          git rev-parse --short HEAD > site/version.txt
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Publish $(cat version.txt)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
